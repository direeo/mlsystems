<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Origin Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            margin: 0
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1)
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px
        }

        label {
            font-size: 13px;
            color: #555;
            display: block;
            margin-bottom: 3px
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px
        }

        .btns {
            text-align: center;
            margin-bottom: 15px
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
            text-align: center;
            display: none
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Wine Origin Prediction</h1>
        <div class="btns">
            <button onclick="load(0)">Cultivar 1</button>
            <button onclick="load(1)">Cultivar 2</button>
            <button onclick="load(2)">Cultivar 3</button>
        </div>
        <form id="form">
            <div class="grid" id="grid"></div>
            <div style="text-align:center"><button type="submit">Predict</button></div>
        </form>
        <div id="result">
            <h2 id="res"></h2>
            <p id="conf"></p>
        </div>
    </div>
    <script>
        const labels = ['Alcohol', 'Malic Acid', 'Ash', 'Alcalinity', 'Magnesium', 'Phenols', 'Flavanoids', 'Nonflavanoids', 'Proanthocyanins', 'Color', 'Hue', 'OD280/OD315', 'Proline'];
        const samples = [[14.23, 1.71, 2.43, 15.6, 127, 2.8, 3.06, 0.28, 2.29, 5.64, 1.04, 3.92, 1065], [12.37, 1.13, 2.16, 19, 87, 3.5, 3.1, 0.19, 1.87, 4.45, 1.22, 2.87, 420], [13.11, 5.49, 2.36, 20, 89, 1.35, 0.75, 0.6, 1.15, 6, 0.74, 1.42, 530]];
        const grid = document.getElementById('grid');
        labels.forEach((l, i) => grid.innerHTML += `<div><label>${l}</label><input type="number" id="f${i}" step="any" required></div>`);
        function load(n) { samples[n].forEach((v, i) => document.getElementById('f' + i).value = v) }
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            let f = []; for (let i = 0; i < 13; i++)f.push(+document.getElementById('f' + i).value);
            let r = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ features: f }) });
            let d = await r.json();
            document.getElementById('result').style.display = 'block';
            document.getElementById('res').textContent = 'Cultivar ' + (d.predicted_class + 1);
            document.getElementById('conf').textContent = 'Confidence: ' + d.confidence;
        };
    </script>
</body>

</html>
