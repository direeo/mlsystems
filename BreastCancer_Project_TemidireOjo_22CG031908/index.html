<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            margin: 0
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1)
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px
        }

        .grid label {
            font-size: 12px;
            color: #555
        }

        .grid input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px
        }

        .btns {
            text-align: center;
            margin-bottom: 15px
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            display: none
        }

        .benign {
            background: #e8f5e9
        }

        .malignant {
            background: #ffebee
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Breast Cancer Prediction</h1>
        <div class="btns">
            <button onclick="loadSample('b')">Benign Sample</button>
            <button onclick="loadSample('m')">Malignant Sample</button>
        </div>
        <form id="form">
            <div class="grid" id="grid"></div>
            <div style="text-align:center"><button type="submit">Analyze</button></div>
        </form>
        <div id="result">
            <h2 id="res"></h2>
            <p id="conf"></p>
        </div>
    </div>
    <script>
        const names = ['radius', 'texture', 'perimeter', 'area', 'smoothness', 'compactness', 'concavity', 'concave pts', 'symmetry', 'fractal dim'];
        const prefixes = ['mean ', 'SE ', 'worst '];
        const samples = { b: [12.3, 12.39, 78.85, 464.1, 0.1028, 0.0698, 0.0399, 0.037, 0.1959, 0.0596, 0.236, 0.666, 1.67, 17.43, 0.008, 0.012, 0.017, 0.012, 0.019, 0.002, 13.5, 15.64, 86.97, 549.1, 0.139, 0.127, 0.124, 0.094, 0.283, 0.068], m: [17.99, 10.38, 122.8, 1001, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.0787, 1.095, 0.905, 8.589, 153.4, 0.006, 0.049, 0.054, 0.016, 0.03, 0.006, 25.38, 17.33, 184.6, 2019, 0.162, 0.666, 0.712, 0.265, 0.46, 0.119] };
        const grid = document.getElementById('grid');
        for (let i = 0; i < 30; i++) { let p = prefixes[Math.floor(i / 10)], n = names[i % 10]; grid.innerHTML += `<div><label>${p}${n}</label><input type="number" id="f${i}" step="any" required></div>` }
        function loadSample(t) { samples[t].forEach((v, i) => document.getElementById('f' + i).value = v.toFixed(4)) }
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            let f = []; for (let i = 0; i < 30; i++)f.push(+document.getElementById('f' + i).value);
            let r = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ features: f }) });
            let d = await r.json();
            let res = document.getElementById('result');
            res.style.display = 'block';
            res.className = d.is_benign ? 'benign' : 'malignant';
            document.getElementById('res').textContent = d.prediction;
            document.getElementById('conf').textContent = 'Confidence: ' + d.confidence;
        };
    </script>
</body>

</html>
